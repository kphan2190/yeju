<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-step jump</title>
<style>
 :root{color-scheme:light dark}
 body{font:16px/1.55 system-ui,-apple-system,sans-serif;margin:0;
      padding:34px 20px;text-align:center}
 .big{font-size:20px;font-weight:650;margin:0 0 10px}
 .s{opacity:.7;font-size:14px}
 a.btn{display:inline-block;margin-top:22px;padding:12px 20px;border-radius:10px;
       background:#1a56c4;color:#fff;text-decoration:none;font-size:17px}
 #phase2{display:none}
</style>
<div id="phase1">
  <p class="big">Opening YouTube...</p>
  <p class="s">When it opens, <b>swipe back to this page</b>. It will then send
     you to the timestamp.</p>
  <a class="btn" id="manual1" href="#">Open it now</a>
</div>
<div id="phase2">
  <p class="big">Welcome back &mdash; jumping to the timestamp</p>
  <p class="s">If nothing happens, tap below.</p>
  <a class="btn" id="manual2" href="#">Go to the timestamp</a>
</div>
<script>
var q = new URLSearchParams(location.search);
var target = q.get("u") || "";
var dummy = q.get("d") || "";
var sent = false;
document.getElementById("manual1").href = dummy;
document.getElementById("manual2").href = target;

function toDummy(){ location.href = dummy; }
function toTarget(){ location.href = target; }

// Phase 1: send them to the dummy so the app is holding something else.
setTimeout(toDummy, 400);

// Phase 2: the moment they come back to this page, send them to the real
// timestamp. The app now holds the dummy, so the target should be a fresh
// load -- which is the whole hypothesis.
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState !== "visible" || sent) return;
  sent = true;
  document.getElementById("phase1").style.display = "none";
  document.getElementById("phase2").style.display = "block";
  setTimeout(toTarget, 500);
});
</script>
