<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>End audition</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0f0f10;color:#e7e7e4;
       font:400 15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
  h1{margin:0 0 4px;font-size:20px;font-weight:650}
  .sub{color:#9a9a95;font-size:13px}
  .panel{background:#1b1b1f;border:1px solid #303036;border-radius:10px;
         padding:12px 14px;margin:14px 0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  label.sw{display:flex;gap:8px;align-items:center;cursor:pointer;
           font-size:14px;white-space:nowrap}
  select,button{font:inherit}
  select{background:#0f0f10;border:1px solid #303036;color:#e7e7e4;
         border-radius:8px;padding:8px 10px;font-size:14px}
  button{background:#1b1b1f;border:1px solid #303036;color:#e7e7e4;
         border-radius:9px;padding:10px 14px;cursor:pointer;min-height:44px}
  button:hover:not(:disabled){border-color:#bf94ff;color:#bf94ff}
  button:disabled{opacity:.35;cursor:default}
  button.go{background:#bf94ff;border-color:#bf94ff;color:#0f0f10;font-weight:600}
  #player{margin:14px 0}
  /* height:auto beats the width/height ATTRIBUTES the API stamps on its own
     iframe, which otherwise win over aspect-ratio and letterbox the video. */
  #player iframe{width:100%;height:auto;aspect-ratio:16/9;max-height:52vh;
                 border:0;border-radius:10px;display:block;background:#000}
  #player:empty{display:none}
  .now .t{font-size:22px;font-weight:650;line-height:1.25}
  .now .a{color:#9a9a95;font-size:14px;margin-top:2px}
  .now .meta{color:#9a9a95;font-size:13px;margin-top:8px;
             font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;
       text-transform:uppercase;padding:2px 7px;border-radius:999px;
       border:1px solid #303036;color:#9a9a95;margin-left:8px}
  .tag.mine{border-color:#bf94ff;color:#bf94ff}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  #status{margin-top:10px;font-size:13px;color:#9a9a95;min-height:20px}
  #status b{color:#bf94ff}
  kbd{background:#0f0f10;border:1px solid #303036;border-radius:5px;
      padding:1px 5px;font-size:12px}
</style>
<div class="wrap">
  <h1>End audition</h1>
  <div class="sub">Shuffles performances and stops them at the end you marked, so you can hear whether the cutoff lands where it should.</div>

  <div class="panel">
    <div class="row">
      <label class="sw"><input type="checkbox" id="useend" checked>
        Stop at the end time</label>
      <select id="pool">
        <option value="mine">Ends I marked, not yet auditioned</option>
        <option value="all">All ends</option>
      </select>
      <select id="jump">
        <option value="0">Play from the start</option>
        <option value="3" selected>Skip to 3s before the end</option>
        <option value="10">Skip to 10s before the end</option>
        <option value="20">Skip to 20s before the end</option>
        <option value="45">Skip to 45s before the end</option>
      </select>
      <span class="sub" id="count"></span>
    </div>
  </div>

  <div id="player"></div>

  <div class="panel now">
    <div class="t" id="song">&nbsp;</div>
    <div class="a" id="artist"></div>
    <div class="meta" id="meta"></div>
    <div class="bar">
      <button id="prev">&#9664; Prev</button>
      <button id="playpause" class="go">Play</button>
      <button id="next">Next &#9654;</button>
      <button id="again">&#8635; Replay</button>
      <button id="toend">Jump to the cutoff</button>
      <button id="detected">Hear the detector's end</button>
    </div>
    <div id="status"></div>
    <div class="sub" style="margin-top:10px">
      <kbd>space</kbd> play/pause &nbsp; <kbd>&#8592;</kbd> prev &nbsp;
      <kbd>&#8594;</kbd> next &nbsp; <kbd>r</kbd> replay &nbsp;
      <kbd>e</kbd> jump to the cutoff
    </div>
  </div>
</div>

  load(pos, {from: Math.max(r.s, r.d - auditionBack()), endAt: r.d});
  el("status").innerHTML = "Auditioning the DETECTOR's end, stopping at <b>" +
    hms(r.d) + "</b>";
};
el("playpause").onclick = function(){
  if (!player) { if (order.length) load(0); return; }
  try{
    if (player.getPlayerState() === 1) player.pauseVideo();
    else player.playVideo();
  }catch(e){}
};
el("useend").onchange = function(){ if (pos >= 0) load(pos); };
el("jump").onchange = function(){ if (pos >= 0) load(pos); };
el("pool").onchange = function(){ build(); if (order.length) load(0); };

document.addEventListener("keydown", function(ev){
  if (ev.target && /input|select|textarea/i.test(ev.target.tagName)) return;
  if (ev.key === " "){ ev.preventDefault(); el("playpause").click(); }
  else if (ev.key === "ArrowRight") next();
  else if (ev.key === "ArrowLeft") prev();
  else if (ev.key === "r") el("again").click();
  else if (ev.key === "e") el("toend").click();
});

try{ el("pool").value = "mine"; }catch(e){}
if (!pool().length && ROWS.length) el("pool").value = "all";
build();
paintCount();
el("status").textContent = "Press Play to start.";
</script>
