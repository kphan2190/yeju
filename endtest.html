function paintPlay(){
  var st = -1;
  try{ if (player && player.getPlayerState) st = player.getPlayerState(); }catch(e){}
  el("playpause").textContent = (st === 1 || st === 3) ? "Pause" : "Play";
}
function next(){ if (pos < order.length - 1) load(pos + 1); }
function prev(){ if (pos > 0) load(pos - 1); }

el("next").onclick = next;
el("prev").onclick = prev;
el("again").onclick = function(){ if (pos >= 0) load(pos); };
el("toend").onclick = function(){
  if (pos < 0) return;
  var r = order[pos];
  load(pos, {from: Math.max(r.s, r.e - auditionBack())});
};
// Play the detector's end instead of yours, same song, so the two can be
// compared back to back rather than from memory.
el("detected").onclick = function(){
  if (pos < 0) return;
  var r = order[pos];
  if (r.d == null) return;
  load(pos, {from: Math.max(r.s, r.d - auditionBack()), endAt: r.d});
  el("status").innerHTML = "Auditioning the DETECTOR's end, stopping at <b>" +
    hms(r.d) + "</b>";
};
el("playpause").onclick = function(){
  if (!player) { if (order.length) load(0); return; }
  try{
    if (player.getPlayerState() === 1) player.pauseVideo();
    else player.playVideo();
  }catch(e){}
};
el("useend").onchange = function(){ if (pos >= 0) load(pos); };
el("jump").onchange = function(){ if (pos >= 0) load(pos); };
el("pool").onchange = function(){ build(); if (order.length) load(0); };

document.addEventListener("keydown", function(ev){
  if (ev.target && /input|select|textarea/i.test(ev.target.tagName)) return;
  if (ev.key === " "){ ev.preventDefault(); el("playpause").click(); }
  else if (ev.key === "ArrowRight") next();
  else if (ev.key === "ArrowLeft") prev();
  else if (ev.key === "r") el("again").click();
  else if (ev.key === "e") el("toend").click();
});

try{ el("pool").value = "all"; }catch(e){}
if (!pool().length && ROWS.length) el("pool").value = "all";
build();
paintCount();
el("status").textContent = "Press Play to start.";
</script>
